# UART0 (the USB-serial chip) carries the framed protocol, so nothing else may
# write to it: no console, printk, logging or boot banner.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# XPT2046 touch controller on SPI2
CONFIG_SPI=y
CONFIG_GPIO=y

# crc32_ieee() for the frame CRC
CONFIG_CRC=y

# boot_id from the hardware RNG
CONFIG_ENTROPY_GENERATOR=y
